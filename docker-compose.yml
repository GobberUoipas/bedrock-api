version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bedrock_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bedrock
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  bedrock-api:
    build: .
    container_name: bedrock_api_app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/bedrock
      - JWT_SECRET=nada_123
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
